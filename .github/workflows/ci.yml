name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Headless export (sample-data path, no API key)
        run: uvx marimo export html --sandbox live_tennis_dashboard.py -o /tmp/export.html
      - name: Assert sample data rendered
        run: |
          grep -q "Sample data" /tmp/export.html
          grep -q "Marchetti" /tmp/export.html
