name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Headless export (sample-data path, no API key)
        run: uvx marimo export html --sandbox live_tennis_dashboard.py -o /tmp/export.html
      - name: Assert sample data rendered
        run: |
          grep -q "Sample data" /tmp/export.html
          grep -q "Marchetti" /tmp/export.html
